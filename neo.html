<!DOCTYPE html>
<html lang="ja" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>MapOn NEO 管理画面</title>
    <!-- ログイン確認が終わるまで画面を表示しない -->
    <style>html.auth-pending body { visibility: hidden; }</style>
    <link rel="icon" href="mapon-logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #F4F7FE; --card-bg: #FFFFFF; --primary-blue: #4285F4; --text-main: #2B3674; --border-color: #E2E8F0; --muted: #718096; --danger: #D93025; --warn-bg: #FFFAF0; --warn: #C05621; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }
        .sidebar { width: 260px; flex: none; background-color: #1A202C; padding: 30px 20px; display: flex; flex-direction: column; color: white; }
        .logo-area { text-align: center; margin-bottom: 40px; }
        .nav-item { padding: 15px; margin-bottom: 10px; border-radius: 12px; color: #A0AEC0; text-decoration: none; font-weight: 600; display: block; }
        .nav-item.active { background-color: #2D3748; color: white; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; min-width: 0; }
        .page-title { font-size: 26px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .card { background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 28px; margin-bottom: 20px; }
        .card h2 { font-size: 17px; margin-bottom: 14px; }
        .btn { background: var(--primary-blue); color: white; border: none; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
        .btn:disabled { opacity: 0.5; cursor: default; }
        .btn.sub { background: #EDF2F7; color: #2D3748; }
        .btn.dark { background: #4A5568; }
        .btn.green { background: #34A853; }
        .btn.danger { background: #FEECEB; color: var(--danger); }
        .btn.small { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
        .muted { color: var(--muted); font-size: 13px; }
        .table { width: 100%; border-collapse: collapse; }
        .table th { padding: 12px; text-align: left; background: #F8FAFC; border-bottom: 2px solid var(--border-color); color: #4A5568; font-size: 13px; white-space: nowrap; }
        .table td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; vertical-align: middle; }
        .table-wrap { overflow-x: auto; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .badge.on { background: #E6F4EA; color: #1E7E34; }
        .badge.off { background: #EDF2F7; color: #718096; }
        .field { margin-bottom: 16px; }
        .field > label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #2D3748; }
        .input, .select, .textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; background: #fff; color: #2D3748; }
        .textarea { min-height: 80px; resize: vertical; font-family: inherit; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .grow { flex: 1; min-width: 200px; }
        .msg { font-size: 12px; margin-top: 6px; }
        .msg.ok { color: #1E7E34; }
        .msg.ng { color: var(--danger); }
        .howto { background: #F8FAFC; border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 12px; color: #4A5568; line-height: 1.8; }
        .howto summary { cursor: pointer; font-weight: 700; }
        .warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.7; margin-bottom: 16px; }
        .q-card { border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 12px; background: #fff; }
        .q-card.dragging { opacity: 0.4; }
        .q-card.drop-before { box-shadow: 0 -3px 0 var(--primary-blue); }
        .q-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .q-handle { cursor: grab; color: #A0AEC0; padding: 4px 6px; font-size: 16px; user-select: none; }
        .q-num { font-weight: 700; color: #4A5568; min-width: 22px; }
        .q-options { margin: 10px 0 0 34px; display: flex; flex-direction: column; gap: 6px; }
        .q-option { display: flex; gap: 6px; align-items: center; }
        .q-option .input { padding: 7px 10px; font-size: 13px; }
        .q-warn { color: var(--warn); font-size: 12px; margin-left: 34px; margin-top: 6px; }
        .icon-btn { background: none; border: none; color: #A0AEC0; cursor: pointer; padding: 6px; font-size: 14px; }
        .icon-btn:hover { color: var(--danger); }
        .sticky-actions { position: sticky; bottom: 0; background: rgba(244,247,254,0.95); padding: 14px 0; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .modal { background: #fff; border-radius: 18px; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 24px; }
        .modal.wide { max-width: 440px; background: #F4F7FE; }
        .modal h3 { margin-bottom: 14px; }
        .qr-img { width: 240px; height: 240px; display: block; margin: 12px auto; border: 1px solid var(--border-color); border-radius: 8px; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; padding: 14px; flex-direction: row; flex-wrap: wrap; gap: 6px; align-items: center; }
            .sidebar .logo-area { margin: 0 10px 0 0; }
            .nav-item { padding: 8px 12px; margin: 0; font-size: 13px; }
            .main-content { padding: 16px; }
            .card { padding: 16px; }
            .q-options, .q-warn { margin-left: 0; }
        }
    </style>
    <style>
        .store-name { font-size: 13px; color: #E2E8F0; margin-top: 10px; font-weight: 700; word-break: break-all; }
        .master-banner[hidden] { display: none; }
        .master-banner { background: #FFFAF0; color: #C05621; border-radius: 12px; padding: 12px 16px; font-size: 13px; margin-bottom: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="logo-area">
            <div style="font-size:24px; font-weight:900; background:linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;">MapOn NEO</div>
            <div class="store-name" id="storeName"></div>
        </div>
        <a href="#/" class="nav-item active" data-view="surveys"><i class="fa-solid fa-clipboard-list"></i> アンケート</a>
        <a href="#/settings" class="nav-item" data-view="settings" style="margin-top:auto;"><i class="fa-solid fa-gear"></i> 設定</a>
        <a href="#" id="logoutLink" class="nav-item"><i class="fa-solid fa-arrow-right-from-bracket"></i> ログアウト</a>
    </nav>
    <main class="main-content">
        <div id="masterBanner" class="master-banner" hidden></div>
        <div id="app"></div>
    </main>

    <script type="module" src="./neo-page.js"></script>
</body>
</html>
