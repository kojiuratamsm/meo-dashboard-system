<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>パスワードの設定 - MapOn</title>
    <link rel="icon" href="mapon-logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // メールのリンクから来たときの情報(#type=recovery / invite、#error=...)を、
        // Supabaseがアドレス欄を書き換える前に控えておく
        window.__initialHash = location.hash;
    </script>
    <style>
        :root {
            --bg-color: #F4F7FE;
            --card-bg: #FFFFFF;
            --primary-blue: #4285F4;
            --text-main: #2B3674;
            --text-muted: #A3AED0;
            --border-color: #E2E8F0;
            --error: #EA4335;
            --ok: #34A853;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        body { background-color: var(--bg-color); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .login-container { width: 100%; max-width: 450px; background: var(--card-bg); border-radius: 20px; box-shadow: 0px 18px 40px rgba(112, 144, 176, 0.12); padding: 50px 40px; }
        @media (max-width: 480px) { .login-container { padding: 36px 22px; } }
        .logo-area { text-align: center; margin-bottom: 32px; }
        .logo-area h1 { font-size: 32px; color: var(--primary-blue); letter-spacing: 2px; }
        .logo-area p { font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; }
        .form-view { display: none; }
        .form-view.active { display: block; }
        .lead { font-size: 13px; color: #4A5568; margin-bottom: 20px; line-height: 1.7; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border-color); outline: none; font-size: 16px; }
        .form-control:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(66,133,244,0.1); }
        .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
        .btn-primary { width: 100%; background: linear-gradient(135deg, var(--primary-blue), #60A5FA); border: none; color: white; padding: 15px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-primary:disabled { opacity: 0.6; cursor: default; }
        .message { font-size: 13px; line-height: 1.7; padding: 12px 14px; border-radius: 10px; margin-bottom: 18px; display: none; }
        .message.error { display: block; background: #FEECEB; color: var(--error); }
        .message.ok { display: block; background: #E6F4EA; color: #1E7E34; }
        .link-text { text-align: center; font-size: 13px; color: var(--primary-blue); margin-top: 25px; display: block; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <h1>MapOn</h1>
            <p>PASSWORD</p>
        </div>

        <div id="message" class="message" role="status"></div>

        <!-- ① パスワードを忘れた場合(メールは送らず、担当者がリンクを発行して送る) -->
        <div id="view-request" class="form-view">
            <p class="lead">パスワードをお忘れの場合は、MapOnの担当者にご連絡ください。<br>
            パスワード再設定用のリンクをお送りします。届いたリンクを開くと、この画面で新しいパスワードを設定できます。</p>
        </div>

        <!-- ② 新しいパスワードを決める(メールのリンクから来たとき) -->
        <div id="view-set" class="form-view">
            <p class="lead">新しいパスワードを設定してください。</p>
            <div class="form-group">
                <label for="newPass">新しいパスワード</label>
                <input type="password" id="newPass" class="form-control" autocomplete="new-password" minlength="8">
                <p class="hint">8文字以上。英字と数字を両方含めてください。</p>
            </div>
            <div class="form-group">
                <label for="newPass2">もう一度入力</label>
                <input type="password" id="newPass2" class="form-control" autocomplete="new-password" minlength="8">
            </div>
            <button id="setBtn" class="btn-primary"><i class="fa-solid fa-key"></i> パスワードを設定する</button>
        </div>

        <a class="link-text" href="/login">ログイン画面へ戻る</a>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';

        const $ = (id) => document.getElementById(id);
        const show = (id) => {
            document.querySelectorAll('.form-view').forEach(v => v.classList.remove('active'));
            $(id).classList.add('active');
        };
        const say = (text, kind) => {
            const el = $('message');
            el.textContent = text;
            el.className = 'message ' + (kind || '');
        };

        const hashParams = new URLSearchParams((window.__initialHash || '').replace(/^#/, ''));
        const cameFromMail = ['recovery', 'invite', 'signup'].includes(hashParams.get('type'));

        async function init() {
            // リンクの期限切れ・使用済みなど
            if (hashParams.get('error')) {
                show('view-request');
                say('リンクの有効期限が切れているか、すでに使われています。お手数ですが、担当者に新しいリンクをご依頼ください。', 'error');
                return;
            }

            // メールのリンクから来た場合、Supabase がログイン状態を作るまで少し待つ
            let { data: { session } } = await supabase.auth.getSession();
            if (!session && cameFromMail) {
                session = await new Promise((resolve) => {
                    const timer = setTimeout(() => resolve(null), 4000);
                    supabase.auth.onAuthStateChange((_event, s) => {
                        if (s) { clearTimeout(timer); resolve(s); }
                    });
                });
            }

            if (session && cameFromMail) {
                show('view-set');
            } else {
                show('view-request');
            }
        }

        $('setBtn').addEventListener('click', async () => {
            const p1 = $('newPass').value;
            const p2 = $('newPass2').value;
            if (p1.length < 8 || !/[A-Za-z]/.test(p1) || !/[0-9]/.test(p1)) {
                say('パスワードは8文字以上で、英字と数字を両方含めてください。', 'error');
                return;
            }
            if (p1 !== p2) {
                say('確認用のパスワードが一致しません。', 'error');
                return;
            }
            const btn = $('setBtn');
            btn.disabled = true;
            const { error } = await supabase.auth.updateUser({ password: p1 });
            btn.disabled = false;
            if (error) {
                say('パスワードを設定できませんでした: ' + error.message, 'error');
                return;
            }
            // 設定後はいったんログアウトし、新しいパスワードでログインしてもらう
            await supabase.auth.signOut();
            $('newPass').value = '';
            $('newPass2').value = '';
            say('パスワードを設定しました。ログイン画面から、新しいパスワードでログインしてください。', 'ok');
            $('setBtn').style.display = 'none';
        });

        init();
    </script>
</body>
</html>
