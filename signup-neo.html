<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お申し込み - MapOn</title>
    <link rel="icon" href="mapon-logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at top right, rgba(79, 70, 229, 0.1), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(79, 70, 229, 0.05), transparent 40%);
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin: 20px;
        }

        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 40px 30px;
            text-align: center;
            color: white;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
        }
        .logo { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin-bottom: 10px; }
        .plan-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            margin-bottom: 15px;
        }
        .header h1 { font-size: 20px; font-weight: 700; line-height: 1.4; }

        .form-body {
            padding: 40px 30px;
        }

        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-control:focus {
            background: white;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(79, 70, 229, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .success-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        /* パスワード欄の「目のマーク」(押すと、入力した文字が見える) */
        .pw-wrap { position: relative; }
        .pw-wrap .form-control { padding-right: 52px; }
        .pw-toggle {
            position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
            width: 42px; height: 42px; border: none; background: transparent;
            border-radius: 10px; color: #64748b; font-size: 17px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .pw-toggle:hover { color: var(--primary); background: rgba(79, 70, 229, 0.08); }
        .pw-toggle svg[hidden] { display: none; }
        .pw-toggle:focus-visible { outline: 3px solid rgba(139, 92, 246, 0.4); outline-offset: 1px; }
        .mail-note { font-size: 13px; line-height: 1.7; color: #475569; background: #f1f5f9; border-radius: 12px; padding: 12px 16px; margin: -10px 20px 24px; max-width: 420px; }
        .mail-note.ok { background: #ecfdf5; color: #047857; }
        
        /* リンクの状態(使用済み・期限切れ・使えない)の表示 */
        .link-state { padding: 40px 30px; text-align: center; }
        .link-state[hidden], .form-body[hidden] { display: none; }
        .link-state .state-icon { width: 64px; height: 64px; border-radius: 50%; background: #f1f5f9; color: #475569; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 18px; }
        .link-state h2 { font-size: 19px; font-weight: 800; line-height: 1.6; color: #1e293b; margin-bottom: 18px; }
        .link-state .login-url { font-size: 13px; color: #64748b; margin-top: 12px; word-break: break-all; }
        .checking { padding: 40px 30px; text-align: center; color: #64748b; font-size: 14px; }
        .checking[hidden] { display: none; }

        /* 利用規約のチェック */
        .agree-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; font-size: 14px; line-height: 1.7; color: var(--text-main); }
        .agree-row input[type=checkbox] { width: 20px; height: 20px; margin-top: 3px; flex-shrink: 0; accent-color: var(--primary); cursor: pointer; }
        .agree-row label { cursor: pointer; }
        .terms-link { background: none; border: none; padding: 0; font: inherit; font-weight: 700; color: var(--primary); text-decoration: underline; cursor: pointer; }

        .success-icon {
            width: 80px; height: 80px;
            background: #10b981;
            color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
        }
    </style>
    <style id="mobileInputFix">
        /* iPhone では、入力欄の文字が16px未満だと、押した瞬間に画面が自動で拡大され、上の入力欄が見えなくなる。スマホでは16px以上にする */
        @media (max-width: 768px), (pointer: coarse) {
            input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]):not([type=submit]):not([type=button]):not([type=image]):not([type=hidden]), select, textarea { font-size: 16px !important; }
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <div class="header">
            <div class="logo">MapOn</div>
            <h1>店舗管理画面のお申し込み</h1>
        </div>
        
        <div class="checking" id="linkChecking" role="status">お申し込みのURLを確認しています…</div>

        <!-- リンクが使えないときの表示(使用済み/期限切れ・取り消し済み/存在しない) -->
        <div class="link-state" id="linkState" hidden>
            <div class="state-icon"><i class="fa-solid fa-link-slash"></i></div>
            <h2 id="linkStateText"></h2>
            <div id="linkStateLogin" hidden>
                <button class="btn-submit" type="button" id="linkStateLoginBtn" style="width:auto; padding:12px 30px; margin:0 auto;" onclick="window.location.href='/login'">ログインはこちら</button>
                <p class="login-url">https://www.mapon-meo.com/login</p>
            </div>
        </div>

        <div class="form-body" id="signupForm" hidden>
            <p style="font-size:13px; color:var(--text-sub); margin-bottom:25px; line-height:1.6;">
                アカウントを発行いたします。以下の項目を入力して登録を完了させてください。<br>ご登録後、すぐに管理画面へログインいただけます。
            </p>

            <div class="form-group">
                <label for="ownerName">氏名</label>
                <input type="text" id="ownerName" class="form-control" placeholder="例: 山田 太郎" autocomplete="name" maxlength="100">
            </div>

            <div class="form-group">
                <label for="storeName">店舗名</label>
                <input type="text" id="storeName" class="form-control" placeholder="例: 焼肉 新宿本店" autocomplete="organization" maxlength="100">
            </div>

            <div class="form-group">
                <label for="emailUrl">メールアドレス(ログインのときに使います)</label>
                <input type="email" id="emailUrl" class="form-control" placeholder="example@shop.com" autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="passwordVal">パスワード(8文字以上・半角英数字)</label>
                <div class="pw-wrap">
                    <input type="password" id="passwordVal" class="form-control" placeholder="••••••••" autocomplete="new-password" minlength="8">
                    <button type="button" class="pw-toggle" data-target="passwordVal" aria-label="パスワードを表示する" aria-pressed="false"><svg class="eye-open" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" hidden viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"/><path d="M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
                </div>
            </div>

            <div class="form-group">
                <label for="passwordConfirm">確認パスワード(同じパスワードをもう一度)</label>
                <div class="pw-wrap">
                    <input type="password" id="passwordConfirm" class="form-control" placeholder="••••••••" autocomplete="new-password" minlength="8">
                    <button type="button" class="pw-toggle" data-target="passwordConfirm" aria-label="確認パスワードを表示する" aria-pressed="false"><svg class="eye-open" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" hidden viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"/><path d="M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
                </div>
            </div>

            <div class="agree-row">
                <input type="checkbox" id="agreeTerms">
                <span><button type="button" class="terms-link" id="openTerms">利用規約</button><label for="agreeTerms">に同意します</label></span>
            </div>

            <p id="formError" role="alert" style="display:none; background:#FEECEB; color:#C5221F; border-radius:10px; padding:12px; font-size:13px; line-height:1.6; margin-bottom:16px;"></p>

            <div class="captcha-box" id="captchaBox"></div>
            <button class="btn-submit" id="submitBtn" onclick="registerClient()">
                <span>申し込む</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- 成功時の画面 -->
    <div class="success-overlay" id="successView">
        <div class="success-icon"><i class="fa-solid fa-check"></i></div>
        <h2 style="font-size:24px; font-weight:800; margin-bottom:15px; color:#1e293b;">登録が完了しました！</h2>
        <p style="color:#64748b; font-size:15px; line-height:1.6; margin-bottom:30px;">
店舗管理画面を発行しました。<br>
            登録したメールアドレスとパスワードで<br>ログインすると、店舗管理画面が開きます。
        </p>
        <p class="mail-note" id="mailNote" role="status" style="display:none;"></p>
        <button class="btn-submit" style="width:auto; padding:12px 30px;" onclick="window.location.href='/login'">ログイン画面へ進む</button>
    </div>

    <script type="module">
        import { supabase } from './supabase-config.js';
        import { TERMS_VERSION, openTermsPopup } from './terms.js';
        import { createCaptcha, isCaptchaError, CAPTCHA_MESSAGE } from './captcha.js';

        // ロボットでないことの確認(Cloudflare Turnstile)。合言葉は、申し込み(signUp)のときに Supabase に渡す。
        // 確認の欄は、申し込みのフォームを表示したときに出す
        const captcha = createCaptcha('captchaBox', 'signup-neo');

        // 「利用規約」を押すと、規約のポップアップが開く(条ごとに開閉できる)
        document.getElementById('openTerms').addEventListener('click', (e) => { e.preventDefault(); openTermsPopup('neo'); });

        // パスワード欄の「目のマーク」:押すたびに、入力した文字を表示する/隠すを切り替える
        document.querySelectorAll('.pw-toggle').forEach((btn) => {
            btn.addEventListener('click', () => {
                const input = document.getElementById(btn.dataset.target);
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');
                const label = btn.dataset.target === 'passwordConfirm' ? '確認パスワード' : 'パスワード';
                btn.setAttribute('aria-label', label + (show ? 'を隠す' : 'を表示する'));
                // 見えている間は「斜線の入った目」、隠れている間は「ふつうの目」(アイコンは画面に直接書いた図形。外部の読み込みに頼らない)
                // (SVGの図形には hidden の指定が効かないため、属性として付け外しする)
                btn.querySelector('.eye-open').toggleAttribute('hidden', show);
                btn.querySelector('.eye-closed').toggleAttribute('hidden', !show);
            });
        });

        // ------------------------------------------------------------
        // ワンタイムリンク:このページは、MSMが発行した「1回だけ使えるURL」(末尾の ?t=…)で開いたときだけ使える。
        // 使えるかどうかの最終の判断は、データベース(申し込みの処理)が行う。ここでの確認は、表示を分けるためだけ。
        // ------------------------------------------------------------
        const inviteToken = (new URLSearchParams(location.search).get('t') || '').trim().toLowerCase();
        const LINK_TEXT = {
            used: '既に有効期限が切れております。',
            expired: 'このURLの有効期限が切れています。<br>担当にご連絡ください。',
            revoked: 'このURLの有効期限が切れています。<br>担当にご連絡ください。',
            invalid: 'このURLは使えません。',
        };
        function showLinkState(state) {
            document.getElementById('linkChecking').hidden = true;
            document.getElementById('signupForm').hidden = true;
            document.getElementById('linkStateText').innerHTML = LINK_TEXT[state] || LINK_TEXT.invalid;
            document.getElementById('linkStateLogin').hidden = state !== 'used';   // 使用済み(申し込みが済んでいる)のときだけ、ログインを案内する
            document.getElementById('linkState').hidden = false;
        }
        function showForm() {
            document.getElementById('linkChecking').hidden = true;
            document.getElementById('linkState').hidden = true;
            document.getElementById('signupForm').hidden = false;
            captcha.mount();
        }
        // リンクの状態:ok / used / expired / revoked / invalid。確かめられないとき(通信の失敗など)は null
        async function checkLink() {
            if (!/^[0-9a-f]{32,64}$/.test(inviteToken)) return 'invalid';
            try {
                const { data, error } = await supabase.rpc('neo_invite_status', { p_token: inviteToken });
                if (error) return null;
                return typeof data === 'string' ? data : null;
            } catch { return null; }
        }
        (async () => {
            const state = await checkLink();
            if (state && state !== 'ok') showLinkState(state); else showForm();
        })();

        // 申し込み直後の「お迎えメール」(ログインURLの案内)を、サーバーに頼む。
        // 送れなくても、申し込み自体は完了している(メールは補助)。待つのは最大10秒。
        async function requestWelcomeMail(accessToken) {
            const note = document.getElementById('mailNote');
            note.className = 'mail-note';
            note.textContent = 'ご登録のメールアドレスに、ログインURLのご案内をお送りしています…';
            note.style.display = 'block';
            let sent = false;
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 10000);
                const res = await fetch('/api/public/welcome', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
                    body: '{}',
                    keepalive: true,   // すぐに「ログイン画面へ進む」を押されても、送信の依頼は届くようにする
                    signal: ctrl.signal
                });
                clearTimeout(timer);
                const body = await res.json().catch(() => ({}));
                sent = res.ok && body && body.sent === true;
            } catch (e) {
                console.warn('お迎えメールの送信に失敗:', e);
            }
            if (sent) {
                note.className = 'mail-note ok';
                note.textContent = 'ご登録のメールアドレスに、ログインURLのご案内をお送りしました。届かない場合は、迷惑メールのフォルダもご確認ください。';
            } else {
                note.textContent = 'ログインURLは https://www.mapon-meo.com/login です。下のボタンからも、ログイン画面に進めます。';
            }
        }

        window.registerClient = async function() {
            const ownerNode = document.getElementById('ownerName');
            const storeNode = document.getElementById('storeName');
            const emailNode = document.getElementById('emailUrl');
            const passNode = document.getElementById('passwordVal');
            const confirmNode = document.getElementById('passwordConfirm');
            const errorBox = document.getElementById('formError');
            const btn = document.getElementById('submitBtn');
            if (btn.disabled) return;   // 二重送信を防ぐ

            const owner_name = ownerNode.value.trim();
            const company_name = storeNode.value.trim();
            const email = emailNode.value.trim();
            const password = passNode.value.trim();
            const passwordConfirm = confirmNode.value.trim();
            const plan = 'D'; // MapOn

            // 入力の間違いは、アラートではなくフォームの中に表示する
            const showError = (message, node) => {
                errorBox.textContent = message;
                errorBox.style.display = 'block';
                if (node) node.focus();
            };
            errorBox.style.display = 'none';

            if(!owner_name || !company_name || !email || !password || !passwordConfirm) {
                showError("全ての項目を入力してください。", !owner_name ? ownerNode : !company_name ? storeNode : !email ? emailNode : !password ? passNode : confirmNode);
                return;
            }
            if(company_name === '(店舗名未入力)') {
                showError("店舗名を入力してください。", storeNode);
                return;
            }
            if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError("メールアドレスの形式が正しくありません。", emailNode);
                return;
            }
            if(password.length < 8) {
                showError("パスワードは8文字以上で入力してください。", passNode);
                return;
            }
            if(password !== passwordConfirm) {
                showError("パスワードと確認パスワードが一致しません。もう一度入力してください。", confirmNode);
                return;
            }
            const agreeTerms = document.getElementById('agreeTerms');
            if(!agreeTerms.checked) {
                showError("利用規約を確認して、チェックを入れてください。", agreeTerms);
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 処理中...';
            btn.disabled = true;

            // 氏名は signUp の付帯情報として渡し、clients への登録はDBのトリガー
            // (handle_mapon_signup)が行う。パスワードは Supabase Auth がハッシュ化して保持し、
            // clients テーブルには保存しない。
            const captchaToken = await captcha.getToken();
            const { data: authData, error: authError } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    captchaToken: captchaToken || undefined,   // ロボットでないことの確認の合言葉
                    // 氏名と店舗名は、DBのトリガー(handle_mapon_signup)が clients に保存する(どちらも100文字まで)。
                    // 店舗名が入っているので、初回ログインの「店舗名の入力」は出ない。
                    // invite は、ワンタイムリンクの文字。データベースが確かめ、申し込みが完了したときに「使用済み」にする。
                    data: { signup_source: 'mapon_signup', owner_name: owner_name, company_name: company_name, plan: plan, invite: inviteToken, terms_version: TERMS_VERSION }
                }
            });

            captcha.reset();   // 合言葉は1回しか使えない

            if (authError) {
                console.error("Auth登録エラー:", authError);
                // リンクが、入力している間に使えなくなった(ほかの人が先に使った・期限が切れた・取り消された)ときは、その表示に切り替える
                if (/Database error saving new user/i.test(authError.message || '')) {
                    const state = await checkLink();
                    if (state && state !== 'ok') { showLinkState(state); return; }
                }
                // よくある原因を、分かる言葉で表示する
                let reason = authError.message || '';
                if (/already registered|already exists/i.test(reason)) {
                    reason = 'このメールアドレスは、すでに登録されています。ログイン画面からログインしてください。';
                } else if (/Database error saving new user/i.test(reason)) {
                    reason = 'このメールアドレスは、すでに店舗として登録されている可能性があります。別のメールアドレスで試すか、担当者にご連絡ください。';
                } else if (isCaptchaError(authError)) {
                    reason = CAPTCHA_MESSAGE;
                } else if (/rate limit/i.test(reason)) {
                    reason = '短い時間に何度も登録が行われました。しばらく待ってから、もう一度お試しください。';
                }
                showError("アカウント作成に失敗しました。" + reason);
                btn.innerHTML = '<span>申し込む</span> <i class="fa-solid fa-arrow-right"></i>';
                btn.disabled = false;
                return;
            }

            // 登録完了の画面を表示し、「ログイン画面へ進む」からログインしてもらう
            document.getElementById('successView').style.display = 'flex';

            // 登録してすぐログインできる設定(Confirm email がオフ)では、ログインの情報が返ってくる。
            // その情報で本人だと確かめてから、サーバーがお迎えメールを送る。
            const accessToken = authData && authData.session && authData.session.access_token;
            if (accessToken) await requestWelcomeMail(accessToken);
        }
    </script>
</body>
</html>
