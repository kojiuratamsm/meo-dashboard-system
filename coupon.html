<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>クーポン</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #F4F7FE; color: #1F2A44; min-height: 100vh; }
        .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
        .tag { font-size: 13px; font-weight: 700; color: #7A4B00; text-align: center; }
        h1 { font-size: 22px; text-align: center; line-height: 1.5; }
        .ticket { background: #fff; border-radius: 18px; box-shadow: 0 6px 20px rgba(31,42,68,0.10); overflow: hidden; }
        .ticket-main { padding: 20px 18px 16px; }
        .store { font-size: 13px; color: #55607A; }
        .headline { font-size: 36px; font-weight: 700; color: #8A4B00; line-height: 1.3; margin: 4px 0; word-break: break-word; }
        .name { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
        .terms { font-size: 13px; color: #55607A; line-height: 1.7; list-style: none; }
        .desc { font-size: 13px; color: #55607A; line-height: 1.7; margin-bottom: 6px; white-space: pre-wrap; }
        .ticket-foot { border-top: 2px dashed #C5CEDD; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .code-label { font-size: 12px; color: #55607A; }
        .code { font-size: 20px; font-weight: 700; letter-spacing: 0.06em; }
        .badge { font-size: 13px; font-weight: 700; border-radius: 12px; padding: 4px 12px; white-space: nowrap; }
        .badge.unused { color: #17642A; background: #E3F4E8; }
        .badge.used { color: #3A4A6B; background: #E4EAF5; }
        .badge.expired { color: #9A3412; background: #FDEBDD; }
        .box { background: #fff; border: 1px solid #E2E8F0; border-radius: 14px; padding: 14px; font-size: 13px; line-height: 1.7; color: #55607A; }
        .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; min-height: 56px; border: none; border-radius: 14px; padding: 10px 16px; font-size: 17px; font-weight: 700; cursor: pointer; font-family: inherit; text-decoration: none; }
        .btn small { font-size: 12px; font-weight: 500; }
        .btn:disabled { opacity: 0.6; cursor: default; }
        .btn-use { background: #8A4B00; color: #fff; }
        .btn-sub { background: #fff; color: #1F5FD1; border: 1.5px solid #1F5FD1; min-height: 48px; font-size: 15px; }
        .btn-danger { background: #B3261E; color: #fff; }
        .confirm { background: #FFF4DC; border: 1.5px solid #E9B949; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .confirm h2 { font-size: 16px; color: #3D2600; }
        .confirm p { font-size: 13px; line-height: 1.7; color: #5A3A00; }
        .used-box { background: #E4EAF5; border-radius: 14px; padding: 18px; text-align: center; }
        .used-box h2 { font-size: 20px; margin-bottom: 4px; }
        .used-box p { font-size: 13px; color: #3A4A6B; }
        .msg { font-size: 13px; color: #B3261E; text-align: center; min-height: 18px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="box" id="loading" style="text-align:center;">読み込み中...</p>

        <div id="notFound" class="box" hidden style="text-align:center;">
            <b style="color:#1F2A44; font-size:16px;">クーポンが見つかりません</b><br>URLが正しいか、ご確認ください。
        </div>

        <div id="coupon" hidden style="display:flex; flex-direction:column; gap:14px;">
            <div>
                <div class="tag">アンケートご回答のお礼</div>
                <h1 id="title">クーポン</h1>
            </div>
            <article class="ticket">
                <div class="ticket-main">
                    <div class="store" id="storeName"></div>
                    <div class="headline" id="headline"></div>
                    <div class="name" id="name"></div>
                    <p class="desc" id="desc" hidden></p>
                    <ul class="terms" id="terms"></ul>
                </div>
                <div class="ticket-foot">
                    <div>
                        <div class="code-label">クーポン番号</div>
                        <div class="code" id="code"></div>
                    </div>
                    <span class="badge" id="status"></span>
                </div>
            </article>

            <div id="unusedArea" style="display:flex; flex-direction:column; gap:12px;">
                <p class="box">お会計のときに、スタッフの前で「クーポンを使う」を押してください。押すと利用済みになり、元には戻せません。</p>
                <button type="button" class="btn btn-use" id="btnUse">クーポンを使う<small>スタッフの前で押してください</small></button>
                <div class="confirm" id="confirmBox" hidden>
                    <h2>いま、スタッフの前にいますか?</h2>
                    <p>「利用済みにする」を押すと、このクーポンは使い終わった状態になり、元には戻せません。</p>
                    <button type="button" class="btn btn-danger" id="btnConfirm">利用済みにする</button>
                    <button type="button" class="btn btn-sub" id="btnCancel">まだ使わない</button>
                </div>
                <p class="msg" id="useMsg" role="alert"></p>
                <p class="box">あとで使う場合は、このページをブックマークするか、ホーム画面に追加してください。このページのURLが、クーポンの引換券になります。</p>
                <button type="button" class="btn btn-sub" id="btnCopyUrl">このページのURLをコピー</button>
            </div>

            <div class="used-box" id="usedArea" hidden>
                <h2 id="usedTitle">利用済み</h2>
                <p id="usedNote"></p>
            </div>
        </div>
    </div>
    <script type="module" src="./coupon-page.js"></script>
</body>
</html>
